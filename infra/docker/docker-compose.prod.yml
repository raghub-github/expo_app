# GatiMitra — production docker-compose for the Hostinger KVM VPS.
#
# Usage (on the VPS):
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d
#
# Services + ports:
#   nginx           — reverse proxy + TLS terminator (80/443 published)
#   backend         — internal-only port 3000
#   notification-worker / payment-worker / ws-gateway — internal-only
#   dashboard       — internal port 3001 (Next standalone)
#   partnersite     — internal port 3000 (Next standalone)
#
# Postgres + Redis are EXTERNAL (Supabase + Redis-Labs respectively) — the
# VPS doesn't run them. That's why both are absent from this compose file.
# Set DATABASE_URL + REDIS_URL via the per-service .env files or .env.prod.
#
# Image source:
#   We build locally on the VPS (matches existing partnersite workflow).
#   In Stage 9 we move to GHCR with `image: ghcr.io/raghub-github/...:GIT_SHA`.

name: gatimitra-prod

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # IMPORTANT — file-to-file mounts only. Never mount the whole
      # ../nginx directory into /etc/nginx or /etc/nginx/conf.d:
      #   - ../nginx:/etc/nginx           ← would clobber mime.types etc.
      #   - ../nginx:/etc/nginx/conf.d    ← would load nginx.conf inside an
      #                                     http{} context, so `worker_processes`
      #                                     would error: "directive not allowed here"
      # nginx.conf below is the MAIN config (has worker_processes / events / http
      # blocks). It replaces the image's default main config. proxy_common.conf
      # is a snippet `include`'d from each server block, not loaded directly.
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend
      - ws-gateway
      - dashboard
      - partnersite
      - cxsite
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [app]

  backend:
    # In prod the VPS pulls a pre-built image from GHCR (pushed by
    # .github/workflows/backend.yml on every push to main). `build:` is kept
    # so `docker compose up --build` still works for local-on-VPS rebuilds.
    # IMAGE_TAG defaults to `latest`; CI rolls deploys by passing a SHA via
    # the deploy-service.sh script and the per-service workflow.
    image: ghcr.io/raghub-github/gm-backend:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      # Firebase Admin SDK reads serviceAccountKey.json at boot for FCM v1
      # sends + phone-auth ID-token verification (which /v1/push/register
      # requires). The file lives on the host at
      #   /opt/gatimitra/backend/credentials/serviceAccountKey.json
      # (gitignored — never in the image). The container path matches
      # env.GOOGLE_APPLICATION_CREDENTIALS=./credentials/serviceAccountKey.json
      # resolved from /app (WORKDIR). File must be chown 1001:1001 on the
      # host so the container's fastify user (UID 1001) can read it.
      - ../../backend/credentials:/app/credentials:ro
    expose:
      - "3000"
    networks: [app]

  notification-worker:
    image: ghcr.io/raghub-github/gm-notification-worker:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: services/notification-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../services/notification-worker/.env
    environment:
      NODE_ENV: production
    volumes:
      # Same mount as backend — the worker needs Firebase Admin for topic
      # subscribe/unsubscribe and error categorisation on the FCM path.
      - ../../backend/credentials:/app/credentials:ro
    networks: [app]

  payment-worker:
    image: ghcr.io/raghub-github/gm-payment-worker:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: services/payment-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../services/payment-worker/.env
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3000
    depends_on:
      - backend
    networks: [app]

  ws-gateway:
    image: ghcr.io/raghub-github/gm-ws-gateway:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: services/ws-gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../services/ws-gateway/.env
    environment:
      NODE_ENV: production
    expose:
      - "4100"
    networks: [app]

  eta-worker:
    image: ghcr.io/raghub-github/gm-eta-worker:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: services/eta-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../services/eta-worker/.env
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3000
    depends_on:
      - backend
    networks: [app]

  financial-rule-worker:
    build:
      context: ../..
      dockerfile: services/financial-rule-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../services/financial-rule-worker/.env
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3000
    depends_on:
      - backend
    networks: [app]

  outbox-relay:
    image: ghcr.io/raghub-github/gm-outbox-relay:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: services/outbox-relay/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../services/outbox-relay/.env
    environment:
      NODE_ENV: production
    networks: [app]

  dashboard:
    image: ghcr.io/raghub-github/gm-dashboard:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: dashboard/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_MERCHANT_ATTACHMENT_PROXY: ${NEXT_PUBLIC_MERCHANT_ATTACHMENT_PROXY}
        NEXT_PUBLIC_MERCHANT_R2_BASE_URL: ${NEXT_PUBLIC_MERCHANT_R2_BASE_URL}
        NEXT_PUBLIC_DISABLE_CURRENT_LOCATION: ${NEXT_PUBLIC_DISABLE_CURRENT_LOCATION}
        NEXT_PUBLIC_ENABLE_PHONE_OTP_REGISTER: ${NEXT_PUBLIC_ENABLE_PHONE_OTP_REGISTER}

    restart: unless-stopped

    env_file:
      - ../../dashboard/.env.local

    environment:
      NODE_ENV: production
      PORT: "3001"
      # nginx returns 403 HTML for /v1/internal on api.gatimitra.com — dashboard
      # must call Fastify on the Docker network, never the public API origin.
      BACKEND_URL: http://backend:3000
      BACKEND_INTERNAL_URL: http://backend:3000

    depends_on:
      - backend

    expose:
      - "3001"

    networks:
      - app

  cxsite:
    # Customer-facing marketing + policy site (gatimitra.com). Built locally
    # on the VPS via infra/scripts/rebuild-cxsite.sh (no GHCR push yet — the
    # image is tagged the same as the GHCR path so compose still finds it).
    image: ghcr.io/raghub-github/gm-cxsite:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: cxsite/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${CXSITE_PUBLIC_APP_URL:-https://gatimitra.com}
        NEXT_PUBLIC_API_URL: ${CXSITE_PUBLIC_API_URL:-https://api.gatimitra.com}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
    restart: unless-stopped
    env_file:
      - ../../cxsite/.env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    networks: [app]

  partnersite:
    image: ghcr.io/raghub-github/gm-partnersite:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: partnersite/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_R2_PUBLIC_BASE_URL: ${NEXT_PUBLIC_R2_PUBLIC_BASE_URL}
        NEXT_PUBLIC_DISABLE_CURRENT_LOCATION: ${NEXT_PUBLIC_DISABLE_CURRENT_LOCATION}
        NEXT_PUBLIC_ENABLE_PHONE_OTP_LOGIN: ${NEXT_PUBLIC_ENABLE_PHONE_OTP_LOGIN}
        NEXT_PUBLIC_ENABLE_PHONE_OTP_REGISTER: ${NEXT_PUBLIC_ENABLE_PHONE_OTP_REGISTER}
    restart: unless-stopped
    env_file:
      - ../../partnersite/.env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  nginx-logs:
