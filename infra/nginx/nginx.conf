# Production Nginx reverse proxy.
#
# Maps:
#   api.gatimitra.com         → backend:3000
#   ws.gatimitra.com          → ws-gateway:4100   (Upgrade: websocket)
#   control.gatimitra.com   → dashboard:3001
#   partner.gatimitra.com     → partnersite:3000
#   rider.gatimitra.com       → rider-web:3001
#
# Security:
#   - /metrics is reachable ONLY from within the docker network. The block
#     below returns 403 when called via any public host header. Prometheus
#     scrapes the backend container directly on the internal `app` network.
#   - HTTP gets 301'd to HTTPS. TLS termination is at this Nginx (LE certs);
#     services upstream stay HTTP for simplicity.
#   - Rate limit zone protects all /v1/* endpoints from spray attacks.

worker_processes auto;
events { worker_connections 4096; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  # ── Logging (JSON for shipping to Loki) ──────────────────────────────
  log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"size":$body_bytes_sent,'
    '"ua":"$http_user_agent",'
    '"rt":$request_time,'
    '"upstream":"$upstream_addr"'
  '}';
  access_log /var/log/nginx/access.log json;
  error_log  /var/log/nginx/error.log warn;

  # Required by the Upgrade/Connection passthrough in proxy_common.conf.
  # When the client sends `Upgrade: websocket`, Connection becomes "upgrade".
  # Otherwise empty so HTTP/1.1 keep-alive isn't broken.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Rate limits ──────────────────────────────────────────────────────
  # Most endpoints: 30 req/s per IP, burst 40.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  # Auth endpoints: tighter — 5 req/s per IP, burst 10.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  # ── Upstreams ────────────────────────────────────────────────────────
  # IMPORTANT: nginx resolves these hostnames ONCE at startup and caches the
  # container IPs forever. When a backend/partnersite/dashboard container is
  # recreated (deploy-service.sh, manual `docker compose up`, etc.) it may
  # come up at a different IP — and worse, the OLD IP can be reassigned to a
  # SIBLING service that also listens on the same port (both `backend` and
  # `partnersite` listen on :3000), causing api.gatimitra.com traffic to
  # silently route into the partnersite Next.js 404 page.
  #
  # The deploy-service.sh wrapper runs `docker compose exec nginx nginx -s reload`
  # after every successful service deploy to force re-resolution. Do not
  # remove that step.
  upstream backend     { server backend:3000;     keepalive 32; }
  upstream ws_gateway  { server ws-gateway:4100;  keepalive 32; }
  upstream dashboard   { server dashboard:3001;   keepalive 32; }
  upstream partnersite { server partnersite:3000; keepalive 32; }
  upstream cxsite      { server cxsite:3000;      keepalive 32; }
  # NOTE: rider-web deliberately has NO static upstream here — it is resolved
  # at request time inside the rider.gatimitra.com server block (see below).

  # ── HTTPS redirect ───────────────────────────────────────────────────
  server {
    listen 80 default_server;
    server_name _;
    # Docker healthcheck endpoint — return 200 without redirecting so the
    # container's healthcheck can probe over plain HTTP at 127.0.0.1.
    # `location = /healthz` must beat the catch-all `location /` redirect,
    # so the redirect lives inside `location /` (not at server scope, where
    # `return` runs before location matching and bypasses /healthz).
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
  }

  # ── api.gatimitra.com (backend) ──────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.gatimitra.com;
    ssl_certificate     /etc/letsencrypt/live/api.gatimitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gatimitra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Block public access to internal endpoints.
    location ~ ^/(metrics|v1/internal) {
      return 403;
    }

    # Tighter rate-limit on auth.
    location /v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://backend;
      include /etc/nginx/proxy_common.conf;
    }

    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend;
      include /etc/nginx/proxy_common.conf;
    }
  }

  # ── ws.gatimitra.com (ws-gateway) ────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name ws.gatimitra.com;
    ssl_certificate     /etc/letsencrypt/live/ws.gatimitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.gatimitra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://ws_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Long timeouts so idle sockets aren't reaped.
      proxy_read_timeout  600s;
      proxy_send_timeout  600s;
    }
  }

  # ── control.gatimitra.com ──────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name control.gatimitra.com;
    ssl_certificate     /etc/letsencrypt/live/control.gatimitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.gatimitra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://dashboard;
      include /etc/nginx/proxy_common.conf;
    }
  }

  # ── partner.gatimitra.com ────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name partner.gatimitra.com;
    ssl_certificate     /etc/letsencrypt/live/partner.gatimitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partner.gatimitra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://partnersite;
      include /etc/nginx/proxy_common.conf;
    }
  }

  # ── rider.gatimitra.com (rider-web) ──────────────────────────────────
  # Unlike the other sites, this block resolves the rider-web container at
  # REQUEST time via Docker's embedded DNS (127.0.0.11), not via a static
  # `upstream {}` resolved once at startup. Two reasons:
  #   1. nginx.conf is shared. A push that adds/edits this block co-triggers
  #      the cxsite (nginx-owner) workflow, whose `nginx -t` would EMERG with
  #      "host not found in upstream" if a static upstream named a rider-web
  #      container that hadn't finished building yet. A variable proxy_pass is
  #      NOT resolved at config-test time, so `nginx -t` always passes.
  #   2. A rider-web redeploy gets a new container IP; the resolver re-resolves
  #      within `valid=10s`, so a rider-web deploy never needs an nginx reload.
  # Applying THIS block (a new server{}) still requires an nginx reload — that
  # is owned by the cxsite/nginx workflow, which fires on nginx.conf changes.
  #
  # TLS: rider.gatimitra.com is a SAN on the `gatimitra.com` certificate
  # (that cert covers `gatimitra.com` + `rider.gatimitra.com`), so we point at
  # /etc/letsencrypt/live/gatimitra.com/ — there is deliberately NO separate
  # rider.gatimitra.com cert dir. This is why, before this block existed,
  # rider.gatimitra.com already served HTTPS: it fell through to the
  # `gatimitra.com` default_server whose cert already covered it. If the cert
  # is ever reissued, keep rider.gatimitra.com in the -d list for gatimitra.com.
  server {
    listen 443 ssl http2;
    server_name rider.gatimitra.com;
    ssl_certificate     /etc/letsencrypt/live/gatimitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gatimitra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $rider_upstream rider-web:3001;
      proxy_pass http://$rider_upstream;
      include /etc/nginx/proxy_common.conf;
    }
  }

  # ── gatimitra.com + www (cxsite marketing + address-share deep links) ──
  # Also the 443 default_server: any request whose SNI matches no other block
  # (bare IP, typo subdomain, etc.) lands on the public site with THIS cert
  # instead of falling through to the api.gatimitra.com cert — which is what
  # produced ERR_CERT_COMMON_NAME_INVALID on gatimitra.com.
  #
  # Requires a cert covering both names, e.g.:
  #   certbot certonly --nginx -d gatimitra.com -d www.gatimitra.com
  #
  # Path routing:
  #   /.well-known/assetlinks.json → backend  (Android App Links verification)
  #   /addr/*                      → backend  (address-share landing + og-logo)
  #   /                            → cxsite   (marketing / policy site)
  #
  # Address-share was previously planned on a dedicated link.gatimitra.com
  # subdomain — collapsed onto the apex on 2026-07-16 to eliminate a whole
  # class of cert-crash outages (see git log around this file for details).
  server {
    listen 443 ssl http2 default_server;
    server_name gatimitra.com www.gatimitra.com;
    ssl_certificate     /etc/letsencrypt/live/gatimitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gatimitra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Canonicalise www → apex (one host for SEO + cookies).
    if ($host = www.gatimitra.com) {
      return 301 https://gatimitra.com$request_uri;
    }

    # assetlinks.json must be reachable without redirects and as JSON. Android's
    # verifier does not follow cross-host redirects, so serve it straight.
    # `location =` is an exact match so it beats any wildcard from cxsite.
    location = /.well-known/assetlinks.json {
      proxy_pass http://backend;
      include /etc/nginx/proxy_common.conf;
    }

    # Address-share landing pages + OG preview image. Rate-limited like the
    # API since public URLs get crawled by WhatsApp/social when previewed.
    location /addr/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend;
      include /etc/nginx/proxy_common.conf;
    }

    location / {
      proxy_pass http://cxsite;
      include /etc/nginx/proxy_common.conf;
    }
  }
}
