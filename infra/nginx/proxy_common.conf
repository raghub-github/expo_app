# Shared proxy headers for every upstream. `include`'d from each server
# block. Keeping common headers here means a header change touches one file
# instead of four.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Propagate request id from upstream Pino logs.
proxy_set_header X-Request-Id $request_id;
proxy_read_timeout  60s;
proxy_send_timeout  60s;
proxy_connect_timeout 5s;
# Pass websocket upgrade through if the upstream wants it.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Buffer sizes large enough for Supabase session Set-Cookie headers (access
# token + refresh token can each be 4-8 KB). Default 4k headers cause an
# upstream-with-large-Set-Cookie response to fail with 502 on /api/auth/*.
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
