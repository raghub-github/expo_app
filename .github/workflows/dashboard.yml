name: dashboard-deploy

# Builds + ships the Next.js admin dashboard image. Triggered on:
#   - push to main with changes under dashboard/** or shared packages it uses
#   - manual run (workflow_dispatch) for emergency rollbacks
#
# Selective: this workflow is the ONLY one that should restart the dashboard
# container. A backend-only push will not trigger it (paths filter below).
#
# Required repo secrets:
#   GHCR_USERNAME, GHCR_TOKEN
#   VPS_HOST, VPS_USER, VPS_SSH_KEY
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_APP_URL
#       — baked into the build because Next bundles them at compile time

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "packages/contracts/**"
      - "packages/shared-utils/**"
      - "packages/shared-config/**"
      - ".github/workflows/dashboard.yml"
      - "infra/scripts/deploy-service.sh"
  workflow_dispatch:

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck (turbo affected)
        run: npx turbo run typecheck --filter='dashboard' --filter='@gatimitra/*'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gm-dashboard:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/gm-dashboard:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Zero-downtime deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/gatimitra
            git fetch --depth 1 origin main
            git reset --hard origin/main
            chmod +x infra/scripts/deploy-service.sh
            # Health check hits port 3001 inside the container (compose env var).
            infra/scripts/deploy-service.sh dashboard http://localhost:3001/api/health 90
