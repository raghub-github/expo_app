name: dashboard-deploy

# Builds + ships the Next.js admin dashboard image. Triggered on:
#   - push to main with changes under dashboard/** or shared packages it uses
#   - manual run (workflow_dispatch) for emergency rollbacks
#
# Selective: this workflow is the ONLY one that should restart the dashboard
# container. A backend-only push will not trigger it (paths filter below).
#
# Required repo secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_APP_URL
#       — baked into the build because Next bundles them at compile time
#
# GHCR auth uses the auto-provisioned GITHUB_TOKEN (no manual secret setup
# needed). The `permissions: packages: write` block below grants it.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "packages/contracts/**"
      - "packages/shared-utils/**"
      - "packages/shared-config/**"
      # Every @gatimitra/* package dashboard/Dockerfile actually COPYs/builds —
      # missing one here means a push that only touches that package silently
      # never rebuilds/redeploys dashboard (see backend.yml for the same fix
      # after this exact gap left a production bug fix undeployed for hours).
      - "packages/rider-availability/**"
      - "packages/financial-rules/**"
      - "packages/slab-pricing/**"
      - ".github/workflows/dashboard.yml"
      - "infra/scripts/deploy-service.sh"
  workflow_dispatch:

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # GITHUB_TOKEN needs `packages: write` to push the built image to GHCR
    # under this repository's owner. `contents: read` is the default but is
    # made explicit here so the SSH deploy step can still git-fetch on the VPS.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck (turbo affected)
        run: npx turbo run typecheck --filter='dashboard' --filter='@gatimitra/*'

      # Refuse to build the image if any NEXT_PUBLIC_* secret is empty.
      # Without this guard, an empty secret silently produces a client bundle
      # with `undefined` — see docs/CI_SECRETS.md for the 2026-06-26 incident.
      # NEXT_PUBLIC_APP_URL is hard-coded to control.gatimitra.com because the
      # SAME GitHub secret cannot serve both dashboard and partnersite (which
      # need different origins). The value is the public origin, not a secret.
      - name: Validate NEXT_PUBLIC_* secrets
        run: |
          set -e
          missing=""
          for var in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
                     NEXT_PUBLIC_MAPBOX_TOKEN \
                     NEXT_PUBLIC_MERCHANT_ATTACHMENT_PROXY \
                     NEXT_PUBLIC_MERCHANT_R2_BASE_URL \
                     NEXT_PUBLIC_DISABLE_CURRENT_LOCATION \
                     NEXT_PUBLIC_ENABLE_PHONE_OTP_REGISTER ; do
            val="${!var}"
            if [ -z "$val" ]; then missing="$missing $var"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Action secrets:$missing"
            echo "::error::Without these, the client bundle ships undefined values."
            echo "::error::Fix: docs/CI_SECRETS.md → gh secret set <name> --body '<value>'"
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_MERCHANT_ATTACHMENT_PROXY: ${{ secrets.NEXT_PUBLIC_MERCHANT_ATTACHMENT_PROXY }}
          NEXT_PUBLIC_MERCHANT_R2_BASE_URL: ${{ secrets.NEXT_PUBLIC_MERCHANT_R2_BASE_URL }}
          NEXT_PUBLIC_DISABLE_CURRENT_LOCATION: ${{ secrets.NEXT_PUBLIC_DISABLE_CURRENT_LOCATION }}
          NEXT_PUBLIC_ENABLE_PHONE_OTP_REGISTER: ${{ secrets.NEXT_PUBLIC_ENABLE_PHONE_OTP_REGISTER }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # github.actor is the user/bot that triggered the run.
          # GITHUB_TOKEN is auto-provisioned per job and scoped by the
          # `permissions:` block at the job level.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gm-dashboard:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/gm-dashboard:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://control.gatimitra.com
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_MERCHANT_ATTACHMENT_PROXY=${{ secrets.NEXT_PUBLIC_MERCHANT_ATTACHMENT_PROXY }}
            NEXT_PUBLIC_MERCHANT_R2_BASE_URL=${{ secrets.NEXT_PUBLIC_MERCHANT_R2_BASE_URL }}
            NEXT_PUBLIC_DISABLE_CURRENT_LOCATION=${{ secrets.NEXT_PUBLIC_DISABLE_CURRENT_LOCATION }}
            NEXT_PUBLIC_ENABLE_PHONE_OTP_REGISTER=${{ secrets.NEXT_PUBLIC_ENABLE_PHONE_OTP_REGISTER }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Zero-downtime deploy on VPS (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 6
          retry_wait_seconds: 45
          retry_on: error
          command: |
            cat <<'EOF' > /tmp/_ssh_script.sh
            set -e
            cd /opt/gatimitra
            git fetch --depth 1 origin main
            git reset --hard origin/main
            chmod +x infra/scripts/deploy-service.sh
            infra/scripts/deploy-service.sh dashboard http://localhost:3001/api/health 90
            EOF
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
            ssh -o ConnectTimeout=30 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
                -i ~/.ssh/id_ed25519 \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                'bash -s' < /tmp/_ssh_script.sh
