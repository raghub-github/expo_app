name: partnersite-deploy

# Builds + ships the Next.js partner portal image. Triggered on:
#   - push to main with changes under partnersite/** or shared packages it uses
#   - manual run (workflow_dispatch) for emergency rollbacks
#
# Selective: only restarts the partnersite container.
#
# Required repo secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_APP_URL
#
# GHCR auth uses the auto-provisioned GITHUB_TOKEN (no manual secret setup
# needed). The `permissions: packages: write` block grants it.

on:
  push:
    branches: [main]
    paths:
      - "partnersite/**"
      - "packages/contracts/**"
      - "packages/shared-utils/**"
      - "packages/shared-config/**"
      - ".github/workflows/partnersite.yml"
      - "infra/scripts/deploy-service.sh"
  workflow_dispatch:

concurrency:
  group: partnersite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck (turbo affected)
        run: npx turbo run typecheck --filter='gmmportal' --filter='@gatimitra/*'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: partnersite/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gm-partnersite:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/gm-partnersite:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=partnersite
          cache-to: type=gha,mode=max,scope=partnersite

      - name: Zero-downtime deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/gatimitra
            git fetch --depth 1 origin main
            git reset --hard origin/main
            chmod +x infra/scripts/deploy-service.sh
            infra/scripts/deploy-service.sh partnersite http://localhost:3002/api/health 90
