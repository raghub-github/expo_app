name: rider-web-deploy

# Builds + ships the rider-facing marketing/onboarding + policy site
# (rider.gatimitra.com). Triggered on:
#   - push to main touching rider-web/**, this workflow, or the deploy script
#   - manual run (workflow_dispatch)
#
# Selective: only rolls the rider-web container. It does NOT touch nginx.
#   • The rider.gatimitra.com server block in infra/nginx/nginx.conf resolves
#     the container at request time (Docker DNS), so a rider-web redeploy is
#     picked up automatically — no nginx reload needed here.
#   • Applying nginx.conf changes (new/edited server blocks) is owned by the
#     cxsite (nginx) workflow, which fires on infra/nginx/nginx.conf changes.
#
# Required repo secrets (same set the other site workflows use):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#
# GHCR auth uses the auto-provisioned GITHUB_TOKEN.
#
# PREREQUISITES on the VPS (one-time, out of band):
#   1. DNS: rider.gatimitra.com A-record → VPS IP. (Already done.)
#   2. TLS: rider.gatimitra.com is a SAN on the EXISTING `gatimitra.com` cert
#        (/etc/letsencrypt/live/gatimitra.com/ covers gatimitra.com +
#        rider.gatimitra.com), so no separate cert is needed. If that cert is
#        ever reissued, keep rider.gatimitra.com in its -d list.
#   3. Runtime env: /opt/gatimitra/rider-web/.env.local must exist on the VPS
#      (gitignored — never in the image; `git reset --hard` leaves it alone).

on:
  push:
    branches: [main]
    paths:
      - "rider-web/**"
      - ".github/workflows/rider-web.yml"
      - "infra/scripts/deploy-service.sh"
  workflow_dispatch:

concurrency:
  group: rider-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      # Refuse to build with an empty client-side secret (would ship `undefined`
      # into the bundle). rider-web bakes NEXT_PUBLIC_* at docker build time.
      - name: Validate NEXT_PUBLIC_* secrets
        run: |
          set -e
          missing=""
          for var in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY ; do
            val="${!var}"
            if [ -z "$val" ]; then missing="$missing $var"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Action secrets:$missing"
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          context: rider-web
          file: rider-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gm-rider-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/gm-rider-web:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=rider-web
          cache-to: type=gha,mode=max,scope=rider-web

      - name: Zero-downtime deploy on VPS (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          command: |
            cat <<'EOF' > /tmp/_ssh_rider_web.sh
            set -e
            cd /opt/gatimitra
            git fetch --depth 1 origin main
            git reset --hard origin/main
            chmod +x infra/scripts/deploy-service.sh
            # Pull the freshly pushed :latest image, bring the container up on
            # the app network (so `rider-web` is resolvable by nginx's request-
            # time resolver), then health-check the container's root path.
            infra/scripts/deploy-service.sh rider-web http://localhost:3001/ 90
            EOF
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
            ssh -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
                -i ~/.ssh/id_ed25519 \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                'bash -s' < /tmp/_ssh_rider_web.sh
