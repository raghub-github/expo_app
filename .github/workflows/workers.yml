name: workers-deploy

# One workflow that builds + ships all four background services. Triggered
# when any worker or shared queue/redis/logger package changes. Matrix
# strategy fans out into per-service jobs sharing the same template.

on:
  push:
    branches: [main]
    paths:
      - "services/notification-worker/**"
      - "services/payment-worker/**"
      - "services/eta-worker/**"
      - "services/outbox-relay/**"
      - "services/ws-gateway/**"
      - "packages/queue/**"
      - "packages/redis/**"
      - "packages/logger/**"
      - "packages/event-contracts/**"
      - "packages/shared-config/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: notification-worker
            image: gm-notification-worker
            dockerfile: services/notification-worker/Dockerfile
            workspace: "@gatimitra/notification-worker"
          - name: payment-worker
            image: gm-payment-worker
            dockerfile: services/payment-worker/Dockerfile
            workspace: "@gatimitra/payment-worker"
          - name: eta-worker
            image: gm-eta-worker
            dockerfile: services/eta-worker/Dockerfile
            workspace: "@gatimitra/eta-worker"
          - name: outbox-relay
            image: gm-outbox-relay
            dockerfile: services/outbox-relay/Dockerfile
            workspace: "@gatimitra/outbox-relay"
          - name: ws-gateway
            image: gm-ws-gateway
            dockerfile: services/ws-gateway/Dockerfile
            workspace: "@gatimitra/ws-gateway"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: Typecheck ${{ matrix.workspace }}
        run: npx turbo run typecheck --filter='${{ matrix.workspace }}'

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Roll workers on VPS (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 6
          retry_wait_seconds: 45
          retry_on: error
          command: |
            cat <<'EOF' > /tmp/_ssh_script.sh
            set -e
            cd /opt/gatimitra
            git fetch --depth 1 origin main
            git reset --hard origin/main
            docker compose -f infra/docker/docker-compose.prod.yml pull \
              notification-worker payment-worker eta-worker outbox-relay ws-gateway
            docker compose -f infra/docker/docker-compose.prod.yml up -d --no-deps \
              notification-worker payment-worker eta-worker outbox-relay ws-gateway
            docker image prune -f
            EOF
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
            ssh -o ConnectTimeout=30 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
                -i ~/.ssh/id_ed25519 \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                'bash -s' < /tmp/_ssh_script.sh
