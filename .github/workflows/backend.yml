name: backend-deploy

# Builds + ships the Fastify backend image. Triggered on:
#   - push to main with changes under backend/** or shared packages it uses
#   - manual run (workflow_dispatch) for emergency rollbacks
#
# The job pushes a tagged image to GHCR and SSHes into the Hostinger VPS to
# pull + restart. Mirrors the existing partnersite/.github/workflows pattern.
#
# Required repo secrets:
#   (GHCR auth uses the auto-provisioned GITHUB_TOKEN — no manual secret needed)
#   VPS_HOST, VPS_USER, VPS_SSH_KEY — deploy target

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/redis/**"
      - "packages/queue/**"
      - "packages/logger/**"
      - "packages/event-contracts/**"
      - "packages/contracts/**"
      - "packages/shared-config/**"
      - "packages/shared-utils/**"
      - "packages/constants/**"
      - "packages/auth/**"
      # Every @gatimitra/* package backend/Dockerfile actually COPYs/builds —
      # missing one here means a push that only touches that package silently
      # never rebuilds/redeploys backend (confirmed: rider-availability was
      # missing and a live production bug fix sat undeployed for hours).
      - "packages/rider-availability/**"
      - "packages/merchant-payout/**"
      - "packages/financial-rules/**"
      - "packages/slab-pricing/**"
      - "packages/store-status/**"
      - "packages/bill-print/**"
      - ".github/workflows/backend.yml"
      - "infra/scripts/deploy-service.sh"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 45, not 25. The retry step below is allowed 20 minutes with
    # max_attempts: 6, so a 25-minute job could never fit a second attempt -
    # the retry budget was decorative. Seen on merge adb5d0f2: attempt 1 died
    # at 18 minutes on a corrupted image pull, attempt 2 was cancelled by the
    # job timeout 4 minutes in, and the deploy reported "cancelled" with no
    # usable error.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck (turbo affected)
        run: npx turbo run typecheck --filter='@gatimitra/backend' --filter='@gatimitra/*'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gm-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/gm-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Zero-downtime deploy on VPS (with retry)
        uses: nick-fields/retry@v3
        with:
          # 20, not 12: a slow `compose pull` on the VPS can eat ~10 minutes, and
          # the step was timing out mid-health-check — which left two replicas
          # running and wedged the deploy (see RECOVERY in deploy-service.sh).
          timeout_minutes: 20
          max_attempts: 6
          retry_wait_seconds: 45
          retry_on: error
          command: |
            cat <<'EOF' > /tmp/_ssh_script.sh
            set -e
            cd /opt/gatimitra
            git fetch --depth 1 origin main
            git reset --hard origin/main
            chmod +x infra/scripts/deploy-service.sh
            # 180s, not 90: backend needs ~55s to answer health on an idle VPS,
            # and a push that touches a shared package or the deploy script
            # co-triggers up to six deploy workflows whose concurrent Docker
            # builds pushed it past 90s and tripped a needless rollback.
            infra/scripts/deploy-service.sh backend http://localhost:3000/v1/health 180
            EOF
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
            ssh -o ConnectTimeout=30 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
                -i ~/.ssh/id_ed25519 \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                'bash -s' < /tmp/_ssh_script.sh

      # The deploy above only ever probes localhost INSIDE the container, so it
      # cannot tell whether nginx is actually routing to the new one. That gap
      # let three deploys report a clean success while api.gatimitra.com served
      # 502 from a cached, dead upstream IP. Check the real hostname, and fail
      # the job if the API is not reachable — a deploy that left production down
      # must never show up green.
      - name: Verify through nginx (public hostname)
        run: |
          chmod +x infra/scripts/verify-public-endpoint.sh
          infra/scripts/verify-public-endpoint.sh https://api.gatimitra.com/v1/health
