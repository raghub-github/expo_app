# This file is intentionally a tombstone, not a real compose definition.
#
# The canonical production compose lives at:
#   infra/docker/docker-compose.prod.yml
#
# The canonical dev compose lives at:
#   infra/docker/docker-compose.dev.yml
#
# Older VPS deploys had a `docker-compose.yml` at the repo root with a
# different (stale) nginx setup — mounting `./infra/nginx:/etc/nginx/conf.d`
# instead of `./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro`. That
# directory-mount layout doesn't work with the production nginx.conf because
# the main config contains `worker_processes`/`events`/`http` directives
# which aren't allowed inside conf.d/.
#
# To deploy from this repo, use:
#   docker compose -f infra/docker/docker-compose.prod.yml up -d
#
# Trying to run `docker compose up` from the repo root with no -f flag will
# pick up this file and fail with a clear error, which is intentional — it
# prevents accidentally starting nginx with the wrong mount layout.

services:
  _do_not_use_root_compose:
    image: alpine:3.19
    command: >
      sh -c '
      echo "" &&
      echo "ERROR: This root-level docker-compose.yml is a tombstone." &&
      echo "       Use infra/docker/docker-compose.prod.yml instead:" &&
      echo "" &&
      echo "         docker compose -f infra/docker/docker-compose.prod.yml up -d" &&
      echo "" &&
      exit 1
      '
