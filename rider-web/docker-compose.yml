services:
  gatimitra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gatimitra-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    # Optional: limit resources when running multiple apps
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #     reservations:
    #       memory: 256M
